<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <h1>User Registration</h1>
    <form action="">
        <label for="fname">
            Firstname:
        </label>
        <input type="text" id="fname" name="firstname" placeholder="Enter your fname" required pattern="[a-zA-Z]">
        <br><br>
        <label for="lname">
            Lastname:
        </label>
        <input type="text" id="lname" name="lastname" placeholder="Enter your lname" pattern="[A-za-z]">
        <br><br>
        <label for="dob">
            Date Of Birth:
        </label>
        <input type="date" id="dob" name="dob">
        <br><br>
        <label for="gender">
            Gender:
        </label>
        <input type="radio" id="gender" name="gender">Male
        <input type="radio" id="gender" name="gender">Female<br><br>

        <label for="">
            Qualification:
        <input type="checkbox" name="" id="">SSLC
        <input type="checkbox" name="" id="">Plus Two
        <input type="checkbox" name="" id="">Degree
        <input type="checkbox" name="" id="">Post Graduation
        </label><br><br>

        <label for="">
            Address:
        </label>
        <textarea name="address" rows="4" cols="30" required minlength="10"
        maxlength="200"></textarea><br><br>

        <label for="select1">
            State:
            <select name="" id="select1">
                <option value="k1">KERALA</option>
                <option value="tn">TAIML NADU</option>
                <option value="ka">KARNATAKA</option>
                <option value="dl">DELHI</option>  
            </select>
        </label>

        <label for="">
            Pincode:
        </label>
        <input type="text" name="pincode" required pattern="[0-9]{6}" maxlength="6">
        <br><br>
        <label for="">
            Email
        </label>
        <input type="email" name="email" placeholder="eg:abc@gmail.com" required>
        <br><br>
        <label for="">
            Phone Number:
        </label>
        <input type="number" name="number" required pattern="[6-9][0-9]{9}" maxlength="10">
        <br><br>
        <label for="">
            Username
        </label>
        <input type="text" name="username" placeholder="Enter username" required>
        <br><br>
        <label for="">
            Password:
        </label>
        <input type="password" name="pswd" placeholder="Enter your password" required minlength="8">
        <br><br>
        <button>Submit</button>
        <button>Reset</button>
    </form>
</body>
</html>
